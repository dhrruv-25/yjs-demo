<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Editor</title>
  <style>
    html, body { margin: 0; height: 100%; background: #12110f; color: #f3eadc; font: 18px/1.7 Georgia, "Times New Roman", serif; }
    .split { display: grid; grid-template-columns: 1fr 1px 1fr; height: 100%; }
    .divider { background: #2c2823; }
    #editor, #preview { box-sizing: border-box; height: 100%; margin: 0; padding: 28px 40px; background: #1f1c18; color: #f3eadc; font: inherit; }
    #editor { border: 0; outline: none; resize: none; white-space: pre-wrap; }
    #preview { overflow: auto; }
    #preview :first-child { margin-top: 0; }
    .caret {
      display: inline-block;
      width: 2px;
      height: 1.15em;
      margin: 0 1px;
      background: var(--c, #7aa2f7);
      vertical-align: text-bottom;
    }
    .caret.mine { background: #ffb86b; }
  </style>
</head>
<body>
  <div class="split">
    <textarea id="editor" spellcheck="false" placeholder="Start writing…"></textarea>
    <div class="divider"></div>
    <div id="preview"></div>
  </div>
  <script src="/static/socket.io.min.js"></script>
  <script>
    const editor = document.getElementById("editor");
    const preview = document.getElementById("preview");
    const socket = io();
    let index = 0;
    let anchor = null;
    let markdown = "";
    let pending = 0;
    let latest = null;
    let placed = false;
    let silent = false;

    function adopt(message) {
      const mine = message.indexes && message.indexes[socket.id];
      if (mine != null) index = mine;
    }

    function show(message) {
      preview.innerHTML = message.html || "";
      preview.querySelectorAll(".caret").forEach((el) => {
        if (el.dataset.sid === socket.id) el.classList.add("mine");
      });
      preview.querySelector(".caret.mine")?.scrollIntoView({ block: "nearest" });
    }

    function place(start, end = start) {
      silent = true;
      editor.value = markdown;
      editor.setSelectionRange(start, end);
      silent = false;
    }

    function paint(message) {
      latest = message;
      show(message);
      if (pending > 0) return;
      markdown = message.markdown || "";
      if (anchor == null) adopt(message);
      if (index > markdown.length) index = markdown.length;
      if (anchor != null) anchor = Math.max(0, Math.min(anchor, markdown.length));
      if (anchor === index) anchor = null;
      if (!placed) {
        placed = true;
        editor.focus();
      }
      if (anchor == null) place(index);
      else place(Math.min(anchor, index), Math.max(anchor, index));
    }

    function ack() {
      pending -= 1;
      if (pending === 0 && latest) paint(latest);
    }

    function send(name, data) {
      pending += 1;
      socket.emit(name, data, ack);
    }

    function rememberSelection() {
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      if (start === end) {
        anchor = null;
        return start;
      }
      anchor = start;
      index = end;
      return null;
    }

    function insert(start, end, char) {
      if (start !== end) send("keystroke", { op: "delete", index: start, count: end - start });
      send("keystroke", { op: "add", index: start, char });
      markdown = markdown.slice(0, start) + char + markdown.slice(end);
      index = start + char.length;
      anchor = null;
      place(index);
    }

    function removeRange(start, end) {
      send("keystroke", { op: "delete", index: start, count: end - start });
      markdown = markdown.slice(0, start) + markdown.slice(end);
      index = start;
      anchor = null;
      place(index);
    }

    socket.on("render", paint);

    function backspaceAt(start) {
      send("keystroke", { op: "backspace", index: start });
      markdown = markdown.slice(0, start - 1) + markdown.slice(start);
      index = start - 1;
      anchor = null;
      place(index);
    }

    function typeChar(char) {
      insert(editor.selectionStart, editor.selectionEnd, char);
    }

    editor.addEventListener("keydown", (event) => {
      if (!socket.connected || event.metaKey || event.ctrlKey || event.altKey || event.isComposing) return;
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      if (event.key === "Backspace" || event.key === "Delete") {
        event.preventDefault();
        if (start !== end) return removeRange(start, end);
        if (event.key === "Backspace" && start > 0) return backspaceAt(start);
        if (event.key === "Delete" && start < markdown.length) return removeRange(start, start + 1);
        return;
      }
      if (event.key === "Enter") {
        event.preventDefault();
        typeChar("\n");
        return;
      }
      const char = event.key;
      if (char.length !== 1) return;
      event.preventDefault();
      typeChar(char);
    });

    editor.addEventListener("beforeinput", (event) => {
      if (!socket.connected || event.defaultPrevented) return;
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      if (event.inputType === "insertFromPaste" || event.inputType === "insertFromDrop") {
        event.preventDefault();
        return;
      }
      if (event.inputType === "deleteContentBackward" || event.inputType === "deleteContentForward" || event.inputType === "deleteByCut") {
        event.preventDefault();
        if (start !== end) return removeRange(start, end);
        if (event.inputType === "deleteContentBackward" && start > 0) return backspaceAt(start);
        if (event.inputType === "deleteContentForward" && start < markdown.length) return removeRange(start, start + 1);
        return;
      }
      if (event.inputType === "insertText" || event.inputType === "insertLineBreak" || event.inputType === "insertParagraph") {
        const char = event.inputType === "insertText" ? event.data : "\n";
        if (!char) return;
        event.preventDefault();
        insert(start, end, char);
      }
    });

    document.addEventListener("selectionchange", () => {
      if (silent || document.activeElement !== editor || !socket.connected) return;
      const collapsed = rememberSelection();
      if (collapsed == null || collapsed === index) return;
      index = collapsed;
      send("cursor", { index });
    });

    document.addEventListener("copy", (event) => {
      if (document.activeElement === editor && editor.selectionStart !== editor.selectionEnd) return;
      event.preventDefault();
      event.clipboardData.setData("text/plain", markdown);
    });

    editor.addEventListener("paste", (event) => {
      if (!socket.connected) return;
      const text = (event.clipboardData.getData("text/plain") || "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
      if (!text) return;
      event.preventDefault();
      insert(editor.selectionStart, editor.selectionEnd, text);
    });
  </script>
</body>
</html>
